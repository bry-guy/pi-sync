name: publish-image

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags: ['v*.*.*']
    # Deploy commits touch only deploy/k8s; ignoring them stops the pin from re-triggering the pipeline.
    paths-ignore:
      - 'deploy/k8s/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-sync-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/heads/feature/* ]]; then
            slug="$(printf '%s' "$source_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed 's/-$//')"
            slug="${slug:-ref}"
            tag="branch-${slug}-${source_sha:0:12}"
          else
            tag="sha-${source_sha:0:12}"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $source_ref at $source_sha as $tag"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-syncd
          tags: |
            type=raw,value=${{ steps.source.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/heads/feature/') || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_SYNC_BUILD_ID=${{ steps.source.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=pi-sync
          cache-to: type=gha,mode=max,scope=pi-sync

  # Push to main deploys production: the digest is pinned in deploy/k8s by a bot commit on main, which Argo CD syncs.
  # Roll back by reverting that commit.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: pi-sync-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ needs.image.outputs.sha }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # deploy.sh comes from the pushed commit; the pin it edits lives on main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: src
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Validate digest
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]'

      # The production hostname is tailnet-only.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_FEDERATED_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_FEDERATED_AUDIENCE }}
          tags: tag:ci

      - name: Deploy production
        working-directory: main
        run: ../src/scripts/deploy.sh production
