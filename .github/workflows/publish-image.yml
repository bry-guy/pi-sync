name: publish-image

on:
  push:
    branches:
      - 'feature/**'
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/heads/feature/* ]]; then
            slug="$(printf '%s' "$source_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed 's/-$//')"
            slug="${slug:-ref}"
            tag="branch-${slug}-${source_sha:0:12}"
          else
            tag="sha-${source_sha:0:12}"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $source_ref at $source_sha as $tag"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-syncd
          tags: |
            type=raw,value=${{ steps.source.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Update deployment digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - "$IMAGE_DIGEST" <<'PY'
          import pathlib
          import re
          import sys

          digest = sys.argv[1]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"unexpected image digest: {digest!r}")
          path = pathlib.Path("deploy/k8s/deployment.yaml")
          text = path.read_text()
          updated, count = re.subn(
              r"ghcr\.io/bry-guy/pi-syncd@sha256:[^\s]+",
              f"ghcr.io/bry-guy/pi-syncd@{digest}",
              text,
          )
          if count != 1:
              raise SystemExit("expected one pi-syncd image reference")
          path.write_text(updated)
          PY

      - name: Commit deployment digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/k8s/deployment.yaml; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add deploy/k8s/deployment.yaml
          git commit -m "chore(deploy): pin image digest [skip ci]"
          git push origin HEAD:main
