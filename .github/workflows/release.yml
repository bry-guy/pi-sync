name: release
on:
  push:
    tags: ["pi-sync-v*"]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no token secret
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pi-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: npm test
      - run: node scripts/check-release-version.js
      - run: npm publish --access public --provenance
