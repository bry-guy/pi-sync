apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-syncd
  labels:
    app.kubernetes.io/name: pi-syncd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-syncd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-syncd
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      nodeSelector:
        selfhost.bry-guy.net/capability-service: "true"
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-syncd
          # Pinned by scripts/deploy.sh on each push to main; roll back by reverting that deploy commit.
          image: ghcr.io/bry-guy/pi-syncd@sha256:2f5c4c8f1a718962b9ef4329a8f25793cc6d828980b88ead01d9287b09be9998
          imagePullPolicy: IfNotPresent
          env:
            - name: PI_SYNC_LISTEN
              value: 0.0.0.0:8080
            - name: PI_SYNC_DATA_DIR
              value: /data
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-sync-data
