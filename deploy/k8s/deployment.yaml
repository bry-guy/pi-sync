apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-syncd
  labels:
    app.kubernetes.io/name: pi-syncd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-syncd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-syncd
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      nodeSelector:
        selfhost.bry-guy.net/capability-service: "true"
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-syncd
          # Replace this placeholder with the published immutable release digest before enabling Argo CD.
          image: ghcr.io/bry-guy/pi-syncd@sha256:dd2885709a57353919c279e78c2e5735bc84ba4711efe0fce7e2876156637951
          imagePullPolicy: IfNotPresent
          env:
            - name: PI_SYNC_LISTEN
              value: 0.0.0.0:8080
            - name: PI_SYNC_DATA_DIR
              value: /data
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-sync-data
