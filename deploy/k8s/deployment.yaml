apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-syncd
  labels:
    app.kubernetes.io/name: pi-syncd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-syncd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-syncd
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-syncd
          # The site overlay must replace this immutable release placeholder.
          image: ghcr.io/earendil-works/pi-syncd:sha-REPLACE_WITH_COMMIT
          imagePullPolicy: IfNotPresent
          env:
            - name: PI_SYNC_LISTEN
              value: 0.0.0.0:8787
            - name: PI_SYNC_DATA_DIR
              value: /var/lib/pi-sync
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/pi-sync
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-syncd-data
